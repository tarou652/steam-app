name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 毎日 6:00 JST
    - cron: '0 21 * * *'
  # 画面の「データを更新」ボタンからも起動する
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Fetch Steam library
        run: npm run fetch
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}

      - name: Resolve base URL
        id: base
        run: |
          # <user>.github.io リポジトリはルート、それ以外は /<repo>/ で配信される
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "url=/" >> "$GITHUB_OUTPUT"
          else
            echo "url=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPO_NAME: ${{ github.event.repository.name }}

      - run: npm run generate
        env:
          NUXT_APP_BASE_URL: ${{ steps.base.outputs.url }}
          NUXT_PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
